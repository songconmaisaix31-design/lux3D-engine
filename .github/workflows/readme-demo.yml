name: README demo card

# Regenerates assets/demo/verify.svg from real command output and commits it
# back when the output changed. The card is never hand-edited.
# 用真实命令输出重画 assets/demo/verify.svg，输出有变化才提交回去；卡片不手改。

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'platforms/**'
      - 'scripts/check_manifests.py'
      - 'scripts/check_numbers.py'
      - 'tools/make-demo.mjs'
      - 'Cargo.toml'
      - 'README.md'
  schedule:
    - cron: '15 3 * * 1' # Mondays 03:15 UTC · 每周一
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-demo
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML · 装 PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Regenerate card from real output · 重画卡片
        run: node tools/make-demo.mjs

      - name: Commit if the card changed · 有变化才提交
        run: |
          if git diff --quiet -- assets/demo/verify.svg; then
            echo "card unchanged · 无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo/verify.svg
          git commit -m "chore(readme): regenerate verification card from real output"
          git push
