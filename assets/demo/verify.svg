<style>
  text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","Noto Sans Mono CJK SC",monospace;font-size:14.5px;white-space:pre}
  .cmd,.out,.pass,.fail,.dim{opacity:0;animation:in .34s ease-out forwards}
